<body data-page="contact">
  <div id="pt-overlay"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>
  <header class="site-header" data-site-nav></header>
  <main>
    <section id="contact-hero" class="hero hero--short">
      <div class="hero-bg">
        <img src="assets/hero-contact.avif" alt="Contact Raj Gupta — open to web development and ML internships" data-parallax-speed="0.35">
      </div>
      <div class="hero-overlay"></div>
      <div class="hero-content reveal">
        <span class="eyebrow">contact &middot; 2026</span>
        <h1 class="hero-title hero-title--page">get in touch</h1>
        <p class="hero-body">Open to internships in web development, full-stack engineering, and machine learning. Let's talk.</p>
      </div>
    </section>

    <section id="contact-form-section" class="section">
      <div class="container contact-panel reveal">
        <div class="contact-panel__media">
          <img src="assets/hero-contact.avif" alt="Contact form background visual" loading="lazy" decoding="async">
        </div>
        <div class="contact-panel__overlay"></div>
        <div class="contact-layout">
          <div class="contact-form-shell">
            <form id="contact-form" class="contact-form" novalidate>
              <!-- Web3Forms configuration -->
              <input type="hidden" name="access_key" value="e984b5ff-5df6-44b9-a8e6-0bac63797469">
              <input type="hidden" name="subject" value="New Contact from Portfolio">
              <input type="hidden" name="from_name" value="Portfolio Contact Form">
              <!-- Honeypot spam protection - bots fill this, humans don't see it -->
              <input type="checkbox" name="botcheck" class="hidden" style="display:none">
              <div class="contact-grid">
                <label class="field-group">
                  <span class="field-label">First Name</span>
                  <input class="field-input" type="text" name="firstName" placeholder="Your first name"
                    data-required="true">
                </label>
                <label class="field-group">
                  <span class="field-label">Last Name</span>
                  <input class="field-input" type="text" name="lastName" placeholder="Your last name"
                    data-required="true">
                </label>
                <label class="field-group" data-span="full">
                  <span class="field-label">Email</span>
                  <input class="field-input" type="email" name="email" placeholder="you@example.com"
                    data-required="true">
                </label>
                <label class="field-group" data-span="full">
                  <span class="field-label">Message</span>
                  <textarea class="field-textarea" name="message" rows="4" placeholder="Tell me what you're building"
                    data-required="true"></textarea>
                </label>
              </div>
              <div class="form-feedback" aria-live="polite"></div>
              <button class="contact-submit" type="submit">Submit</button>
            </form>
            <div class="contact-success">Message received. I'll be in touch.</div>
          </div>
        </div>
      </div>
    </section>
