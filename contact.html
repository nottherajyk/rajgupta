<!DOCTYPE html>
<html lang="en">

<head>
  <title>Contact | Raj Gupta</title>
  <meta name="description" content="Contact Raj Gupta for internships, collaborations, and creative projects.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="stylesheet" href="css/journal.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/contact.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/cursor.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="contact">
  <div id="pt-overlay"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>
  <header class="site-header" data-site-nav></header>
  <main>
    <section id="contact-hero" class="hero hero--short">
      <div class="hero-bg">
        <!-- EDIT ME: replace src with your contact hero image -->
        <img src="assets/hero-contact.avif" alt="Contact hero visual" data-parallax-speed="0.35">
      </div>
      <div class="hero-overlay"></div>
      <div class="hero-content reveal">
        <span class="eyebrow">contact Us.25</span>
        <h1 class="hero-title hero-title--page">get in touch</h1>
        <p class="hero-body">Open to the right conversations - internships, collaborations, and creative projects.</p>
      </div>
    </section>

    <section id="contact-form-section" class="section">
      <div class="container contact-panel reveal">
        <div class="contact-panel__media">
          <!-- EDIT ME: replace src with your contact background -->
          <img src="assets/hero-contact.avif" alt="Contact panel background">
        </div>
        <div class="contact-panel__overlay"></div>
        <div class="contact-layout">
          <div class="contact-form-shell">
            <form id="contact-form" class="contact-form" novalidate>
              <!-- Web3Forms configuration -->
              <input type="hidden" name="access_key" value="e984b5ff-5df6-44b9-a8e6-0bac63797469">
              <input type="hidden" name="subject" value="New Contact from Portfolio">
              <input type="hidden" name="from_name" value="Portfolio Contact Form">
              <!-- Honeypot spam protection - bots fill this, humans don't see it -->
              <input type="checkbox" name="botcheck" class="hidden" style="display:none">
              <div class="contact-grid">
                <label class="field-group">
                  <span class="field-label">First Name</span>
                  <input class="field-input" type="text" name="firstName" placeholder="Your first name"
                    data-required="true">
                </label>
                <label class="field-group">
                  <span class="field-label">Last Name</span>
                  <input class="field-input" type="text" name="lastName" placeholder="Your last name"
                    data-required="true">
                </label>
                <label class="field-group" data-span="full">
                  <span class="field-label">Email</span>
                  <input class="field-input" type="email" name="email" placeholder="you@example.com"
                    data-required="true">
                </label>
                <label class="field-group" data-span="full">
                  <span class="field-label">Message</span>
                  <textarea class="field-textarea" name="message" rows="4" placeholder="Tell me what you're building"
                    data-required="true"></textarea>
                </label>
              </div>
              <div class="form-feedback" aria-live="polite"></div>
              <button class="contact-submit" type="submit">Submit</button>
            </form>
            <div class="contact-success">Message received. I'll be in touch.</div>
          </div>
        </div>
      </div>
    </section>


  </main>
  <footer class="site-footer" data-site-footer></footer>
  <script src="js/site-data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/scroll-reveal.js"></script>
  <script src="js/counter.js"></script>
  <script src="js/accordion.js"></script>
  <script src="js/marquee.js"></script>
  <script src="js/page-transition.js"></script>
  <script src="js/hero-parallax.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/projects-strip.js"></script>
  <script src="js/init.js"></script>
</body>

</html>
